<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方形框鳃区同步观察台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15202b;
      --muted: #667085;
      --line: #d4dae2;
      --soft-line: #eaecf0;
      --paper: #ffffff;
      --wash: #f4f6f8;
      --header: #17212b;
      --teal: #087f78;
      --orange: #c65b16;
      --blue: #2563a9;
      --red: #b42318;
      --green: #16794b;
    }
    * { box-sizing: border-box; }
    html { background: var(--wash); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font-family: "Microsoft YaHei", "Noto Sans SC", "Segoe UI", Arial, sans-serif;
      line-height: 1.45;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app-header {
      min-height: 98px;
      padding: 20px 30px;
      color: #f8fafc;
      background: var(--header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: #9bd8d1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .readout {
      display: flex;
      align-items: stretch;
      border: 1px solid #3b4652;
      border-radius: 8px;
      overflow: hidden;
      flex: 0 0 auto;
    }
    .readout div {
      min-width: 128px;
      padding: 9px 14px;
      background: #202c38;
    }
    .readout div + div { border-left: 1px solid #3b4652; }
    .readout span {
      display: block;
      color: #aeb9c6;
      font-size: 11px;
    }
    .readout strong {
      display: block;
      margin-top: 2px;
      color: #ffffff;
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    main {
      max-width: 1560px;
      margin: 0 auto;
      padding: 20px 24px 42px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(270px, 0.72fr) minmax(390px, 1.08fr);
      gap: 18px;
      align-items: start;
    }
    .video-column, .roi-panel, .signal-section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .video-column { overflow: hidden; }
    .video-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d1117;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #0d1117;
      object-fit: contain;
    }
    #videoOverlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .transport-bar {
      min-height: 52px;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: auto auto minmax(120px, 1fr) minmax(140px, 185px);
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--line);
      background: #fbfcfd;
    }
    .size-tuner {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .size-tuner input[type="range"] {
      min-width: 55px;
      accent-color: var(--teal);
    }
    .size-tuner output {
      width: 34px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .speed-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 7px;
      border-top: 1px solid var(--soft-line);
    }
    .speed-label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .speed-row .segment button {
      min-width: 42px;
      padding: 0 8px;
      font-variant-numeric: tabular-nums;
    }
    .step-button {
      width: 46px;
      height: 34px;
      padding: 0;
      border: 1px solid #c7ced8;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .step-button:hover { border-color: #7d8a99; background: #f3f6f8; }
    .step-button:focus-visible, .segment button:focus-visible, .fish-button:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 2px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--teal);
      cursor: pointer;
    }
    .roi-panel { padding: 14px; }
    .panel-heading, .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .panel-heading { margin-bottom: 10px; }
    h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }
    .sync-badge {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .roi-list {
      display: grid;
      gap: 10px;
    }
    .roi-item {
      border: 1px solid var(--soft-line);
      border-radius: 6px;
      overflow: hidden;
      background: #fbfcfd;
    }
    .roi-item[data-fish="1"] { --fish-color: var(--teal); }
    .roi-item[data-fish="2"] { --fish-color: var(--orange); }
    .roi-item[data-fish="3"] { --fish-color: var(--blue); }
    .roi-item[data-fish="4"] { --fish-color: #6b7f16; }
    .roi-item[data-fish="5"] { --fish-color: #a83258; }
    .roi-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--soft-line);
      background: #ffffff;
    }
    .fish-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fish-color);
    }
    .roi-head h3 {
      margin: 0;
      font-size: 13px;
    }
    .roi-state {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .roi-state.valid { color: var(--green); }
    .roi-state.invalid { color: var(--red); }
    .roi-canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 7;
      background: #111820;
      object-fit: contain;
    }
    .roi-values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #ffffff;
      border-top: 1px solid var(--soft-line);
    }
    .roi-values div { padding: 7px 10px 8px; }
    .roi-values div + div { border-left: 1px solid var(--soft-line); }
    .roi-values span {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }
    .roi-values strong {
      display: block;
      margin-top: 1px;
      font-size: 15px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .signal-section {
      min-width: 0;
      margin-top: 0;
      padding: 16px 18px 18px;
    }
    .signal-section .section-heading {
      align-items: flex-start;
      flex-direction: column;
      gap: 9px;
    }
    .signal-section .controls {
      justify-content: flex-start;
    }
    .section-heading { margin-bottom: 10px; }
    .section-heading p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .tuner {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 9px;
      border: 1px solid #cbd2da;
      border-radius: 6px;
      background: #ffffff;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .tuner input[type="range"] {
      width: 92px;
      accent-color: #c1121f;
    }
    .tuner output {
      min-width: 36px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .segment {
      display: inline-flex;
      padding: 2px;
      border: 1px solid #cbd2da;
      border-radius: 6px;
      background: #f4f6f8;
    }
    .segment button {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .segment button.active {
      color: #ffffff;
      background: var(--header);
    }
    .fish-filter {
      display: flex;
      gap: 6px;
      margin: 3px 0 10px;
    }
    .fish-button {
      min-width: 54px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid #cbd2da;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .fish-button.active { border-color: var(--header); color: var(--ink); background: #e9edf1; }
    .chart-block {
      margin-top: 10px;
      border-top: 1px solid var(--soft-line);
      padding-top: 8px;
    }
    .chart-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 2px;
    }
    .chart-heading strong { font-size: 13px; }
    .chart-heading span { color: var(--muted); font-size: 11px; }
    .signal-chart {
      display: block;
      width: 100%;
      height: 230px;
      cursor: crosshair;
      touch-action: none;
    }
    .signal-section.variance-focus #meanChartBlock { display: none; }
    .signal-section.variance-focus #varianceChart { height: 470px; }
    .signal-section:not(.variance-focus) #varianceChartBlock { display: none; }
    .footer-note {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
    }
    .loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      color: #ffffff;
      background: rgba(20, 29, 38, 0.94);
      transition: opacity 180ms ease;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .loading-panel { text-align: center; }
    .loading-line {
      width: 180px;
      height: 3px;
      margin: 12px auto 0;
      overflow: hidden;
      background: #3c4854;
    }
    .loading-line::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: #8dd9d1;
      animation: load 1.1s ease-in-out infinite alternate;
    }
    @keyframes load {
      from { transform: translateX(0); }
      to { transform: translateX(140%); }
    }
    @media (max-width: 1250px) {
      .workspace {
        grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.85fr);
      }
      .roi-panel {
        grid-column: 1 / -1;
        order: 3;
      }
      .roi-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .roi-canvas { aspect-ratio: 16 / 9; }
    }
    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 1fr; }
      .roi-panel { grid-column: auto; order: 2; }
      .roi-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .roi-canvas { aspect-ratio: 16 / 9; }
    }
    @media (max-width: 720px) {
      .app-header { min-height: auto; padding: 15px 14px; align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: 22px; }
      .readout { width: 100%; }
      .readout div { flex: 1; min-width: 0; }
      main { padding: 12px 10px 28px; }
      .workspace { gap: 10px; }
      .roi-panel { padding: 10px; }
      .roi-list { grid-template-columns: 1fr; }
      .roi-canvas { aspect-ratio: 16 / 6; }
      .signal-section { margin-top: 10px; padding: 12px 10px 14px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 9px; }
      .controls { justify-content: flex-start; }
      .signal-chart { height: 215px; }
      .transport-bar { grid-template-columns: auto auto minmax(80px, 1fr); }
      .size-tuner { grid-column: 1 / -1; }
      .footer-note { flex-direction: column; gap: 3px; }
    }
  </style>
</head>
<body>
  <div id="launch-note" style="padding:10px 18px;background:#eef5f4;color:#234b43;font-size:13px">
    维护：chenxi。请运行本目录对应的 *_viewer.py，并打开其显示的网址。
    页面只读取已生成的结果；参数预览不回写分析CSV，视频叠加仅显示当前帧的有效记录。
    分析结果更新后请重启页面服务。
  </div>
  <script id="viewer-meta" type="application/json">{}</script>
  <script>window.viewerMeta=JSON.parse(document.getElementById("viewer-meta").textContent);</script>
  <header class="app-header">
    <div>
      <span class="eyebrow">GILL BOX / FRAME SYNC</span>
      <h1>方形框鳃区同步观察台</h1>
    </div>
    <div class="readout" aria-live="polite">
      <div><span>时间</span><strong id="timeReadout">00:00.00</strong></div>
      <div><span>帧</span><strong id="frameReadout">0 / 0</strong></div>
    </div>
  </header>

  <main>
    <section class="workspace">
      <div class="video-column">
        <div class="video-shell">
          <video id="video" src="/video" preload="auto" controls playsinline muted></video>
          <canvas id="videoOverlay"></canvas>
        </div>
        <div class="transport-bar">
          <button class="step-button" id="prevFrame" type="button" title="上一帧">-1</button>
          <button class="step-button" id="nextFrame" type="button" title="下一帧">+1</button>
          <input id="frameSlider" type="range" min="1" max="1" value="1" aria-label="视频帧">
          <label class="size-tuner" title="调整视频画面宽度">
            画面大小
            <input id="layoutSize" type="range" min="35" max="60" step="1" value="47">
            <output id="layoutSizeValue">47%</output>
          </label>
          <div class="speed-row">
            <span class="speed-label">播放速度</span>
            <div class="segment" id="speedControl" role="group" aria-label="播放速度">
              <button type="button" data-speed="0.25">0.25×</button>
              <button type="button" data-speed="0.5">0.5×</button>
              <button type="button" data-speed="1" class="active">1×</button>
              <button type="button" data-speed="2">2×</button>
              <button type="button" data-speed="4">4×</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="roi-panel">
        <div class="panel-heading">
          <h2>当前鳃区</h2>
          <span class="sync-badge" id="syncBadge">等待视频</span>
        </div>
        <div class="roi-list"></div>
      </aside>
      <section class="signal-section">
      <div class="section-heading">
        <div>
          <h2>灰度曲线</h2>
          <p id="chartModeNote">0.60–1.50 Hz 带通残差</p>
        </div>
        <div class="controls">
          <div class="segment" id="modeControl" role="group" aria-label="曲线类型">
            <button type="button" data-mode="raw">原始灰度</button>
            <button type="button" data-mode="variance">灰度方差</button>
            <button type="button" data-mode="filtered" class="active">带通残差</button>
          </div>
          <div class="segment" id="windowControl" role="group" aria-label="时间窗口">
            <button type="button" data-window="10" class="active">10 秒</button>
            <button type="button" data-window="20">20 秒</button>
            <button type="button" data-window="0">全程</button>
          </div>
          <label class="tuner" title="突出度越低，检测到的小峰越多">
            峰突出度
            <input id="peakProminence" type="range" min="0.02" max="0.40" step="0.01" value="0.05">
            <output id="peakProminenceValue">0.05</output>
          </label>
          <label class="tuner" title="两个峰之间的最小时间间隔">
            最小间隔
            <input id="peakDistance" type="range" min="0.20" max="0.60" step="0.05" value="0.25">
            <output id="peakDistanceValue">0.25s</output>
          </label>
        </div>
      </div>
      <div class="fish-filter" id="fishControl" role="group" aria-label="鱼号"></div>

      <div class="chart-block" id="meanChartBlock">
        <div class="chart-heading">
          <strong id="meanChartTitle">灰度均值</strong>
          <span id="meanChartUnit">0–255</span>
        </div>
        <canvas id="meanChart" class="signal-chart" aria-label="灰度均值曲线"></canvas>
      </div>
      <div class="chart-block" id="varianceChartBlock">
        <div class="chart-heading">
          <strong id="varianceChartTitle">灰度方差</strong>
          <span id="varianceChartUnit">像素灰度方差</span>
        </div>
        <canvas id="varianceChart" class="signal-chart" aria-label="灰度方差曲线"></canvas>
      </div>
      <div class="footer-note">
        <span id="bandNote">带通频带 0.60–1.50 Hz</span>
        <span id="dataNote">50 fps · 逐帧同步</span>
      </div>
      </section>
    </section>
  </main>

  <div class="loading" id="loading">
    <div class="loading-panel">
      <strong id="loadingText">正在载入跟踪数据</strong>
      <div class="loading-line"></div>
    </div>
  </div>

  <script>
    const COLORS = {
      1: { line: "#087f78", soft: "rgba(8, 127, 120, 0.14)" },
      2: { line: "#c65b16", soft: "rgba(198, 91, 22, 0.14)" },
      3: { line: "#2563a9", soft: "rgba(37, 99, 169, 0.14)" },
      4: { line: "#6b7f16", soft: "rgba(107, 127, 22, 0.14)" },
      5: { line: "#a83258", soft: "rgba(168, 50, 88, 0.14)" },
    };
    const state = {
      data: null,
      frameIndex: 0,
      selectedFish: "1",
      mode: "filtered",
      windowSeconds: 10,
      peakProminence: 0.05,
      peakDistance: 0.25,
      frequencyWindowSeconds: 10,
      draggingChart: null,
      videoReady: false,
      metadataReady: false,
    };

    const video = document.getElementById("video");
    const workspace = document.querySelector(".workspace");
    const layoutSize = document.getElementById("layoutSize");
    const layoutSizeValue = document.getElementById("layoutSizeValue");
    const speedControl = document.getElementById("speedControl");
    const overlay = document.getElementById("videoOverlay");
    const frameSlider = document.getElementById("frameSlider");
    const timeReadout = document.getElementById("timeReadout");
    const frameReadout = document.getElementById("frameReadout");
    const syncBadge = document.getElementById("syncBadge");
    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const meanChart = document.getElementById("meanChart");
    const varianceChart = document.getElementById("varianceChart");
    const signalSection = document.querySelector(".signal-section");
    const chartModeNote = document.getElementById("chartModeNote");
    const meanChartTitle = document.getElementById("meanChartTitle");
    const varianceChartTitle = document.getElementById("varianceChartTitle");
    const meanChartUnit = document.getElementById("meanChartUnit");
    const varianceChartUnit = document.getElementById("varianceChartUnit");
    const bandNote = document.getElementById("bandNote");
    const dataNote = document.getElementById("dataNote");


    function applyLayoutSize() {
      if (window.innerWidth <= 1250) {
        workspace.style.gridTemplateColumns = "";
        return;
      }
      const width = workspace.clientWidth;
      const gap = 36;
      const fraction = Number(layoutSize.value) / 100;
      const maxVideoWidth = width - gap - 220 - 330;
      const videoWidth = Math.round(
        Math.max(430, Math.min(width * fraction, maxVideoWidth))
      );
      const remaining = Math.max(1, width - gap - videoWidth);
      const roiWidth = Math.round(
        Math.max(220, Math.min(310, remaining * 0.38))
      );
      const chartWidth = Math.max(1, remaining - roiWidth);
      workspace.style.gridTemplateColumns =
        `${videoWidth}px ${roiWidth}px ${chartWidth}px`;
      layoutSizeValue.textContent = `${layoutSize.value}%`;
    }

    let preferredPlaybackRate = 1;

    function applyPlaybackRate(rate, persist = true) {
      const numericRate = Number(rate);
      if (![0.25, 0.5, 1, 2, 4].includes(numericRate)) return;
      preferredPlaybackRate = numericRate;
      video.playbackRate = numericRate;
      speedControl.querySelectorAll("button[data-speed]").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.speed) === numericRate);
      });
      if (persist) {
        try {
          localStorage.setItem("squarePlaybackRate", String(numericRate));
        } catch {}
      }
    }

    function fishById(id) {
      return state.data?.fish.find((fish) => fish.id === id);
    }

    function currentTime() {
      return Number.isFinite(video.currentTime) ? video.currentTime : 0;
    }

    function frameIndexFromTime(time) {
      if (!state.data) return 0;
      return Math.max(
        0,
        Math.min(state.data.meta.frameCount - 1, Math.floor(time * state.data.meta.fps))
      );
    }

    function formatTime(seconds) {
      const safe = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safe / 60);
      const remaining = safe - minutes * 60;
      return `${String(minutes).padStart(2, "0")}:${remaining.toFixed(2).padStart(5, "0")}`;
    }

    function formatNumber(value, digits = 2) {
      return Number.isFinite(value) ? value.toFixed(digits) : "—";
    }

    function selectedFishIds() {
      if (state.selectedFish === "all") return state.data.fish.map((fish) => fish.id);
      return [Number(state.selectedFish)];
    }

    function detectFishPeaks(fish, kind, mode = state.mode) {
      const rawMode = mode !== "filtered";
      const candidates = rawMode
        ? (kind === "mean" ? fish.meanRawPeakCandidates : fish.varianceRawPeakCandidates)
        : (kind === "mean" ? fish.meanPeakCandidates : fish.variancePeakCandidates);
      const minDistanceFrames = Math.max(1, Math.round(state.peakDistance * state.data.meta.fps));
      const eligible = candidates
        .filter((candidate) => candidate.prominence >= state.peakProminence)
        .sort((left, right) => right.prominence - left.prominence);
      const selected = [];
      for (const candidate of eligible) {
        if (selected.every((item) => Math.abs(item.index - candidate.index) >= minDistanceFrames)) {
          selected.push(candidate);
        }
      }
      return selected.sort((left, right) => left.index - right.index);
    }

    function frequencyForFrame(fish, frameIndex) {
      const fps = state.data.meta.fps;
      const minFrame = fish.firstFrame - 1;
      if (frameIndex < minFrame) return null;
      const windowFrames = Math.max(1, Math.round(state.frequencyWindowSeconds * fps));
      const start = Math.max(minFrame, frameIndex - windowFrames + 1);
      const availableFrames = frameIndex - start + 1;
      if (availableFrames < Math.max(1, Math.round(5 * fps))) return null;
      const peaks = detectFishPeaks(fish, "mean", "filtered");
      const count = peaks.filter((peak) => peak.index >= start && peak.index <= frameIndex).length;
      return count * 60.0 / (availableFrames / fps);
    }

    function seekToFrame(frameIndex) {
      if (!state.metadataReady) return;
      const maxIndex = state.data.meta.frameCount - 1;
      const next = Math.max(0, Math.min(maxIndex, frameIndex));
      video.currentTime = next / state.data.meta.fps;
      state.frameIndex = next;
      updateView();
    }

    function resizeCanvas(canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));
      if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
        canvas.width = width * dpr;
        canvas.height = height * dpr;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, width, height };
    }

    function drawVideoOverlay() {
      if (!state.metadataReady || !state.data) return;
      const { ctx, width, height } = resizeCanvas(overlay);
      ctx.clearRect(0, 0, width, height);
      if (!state.videoReady) return;
      const scaleX = width / state.data.meta.width;
      const scaleY = height / state.data.meta.height;
      const index = state.frameIndex;

      for (const fish of state.data.fish) {
        if (index >= fish.boxes.length) continue;
        const box = fish.boxes[index];
        if (!box) continue;
        const [x1, y1, x2, y2, valid] = box;
        const x = x1 * scaleX;
        const y = y1 * scaleY;
        const w = (x2 - x1) * scaleX;
        const h = (y2 - y1) * scaleY;
        const color = COLORS[fish.id].line;
        ctx.save();
        ctx.strokeStyle = valid ? color : "#b42318";
        ctx.lineWidth = 2;
        ctx.setLineDash(valid ? [] : [7, 5]);
        ctx.strokeRect(x + 1, y + 1, Math.max(1, w - 2), Math.max(1, h - 2));
        ctx.setLineDash([]);
        const frequency = frequencyForFrame(fish, index);
        const frequencyText = Number.isFinite(frequency)
          ? `${frequency.toFixed(1)} 次/分`
          : "窗口未满";
        const label = `区域 ${fish.id} · ${frequencyText}`;
        ctx.font = "600 12px Microsoft YaHei, sans-serif";
        const labelWidth = ctx.measureText(label).width + 12;
        const labelX = Math.max(2, Math.min(x + 2, width - labelWidth - 2));
        ctx.fillStyle = valid ? color : "#b42318";
        ctx.fillRect(labelX, Math.max(0, y - 22), labelWidth, 20);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, labelX + 6, Math.max(14, y - 7));
        ctx.restore();
      }
    }

    function drawContainedImage(ctx, source, sx, sy, sw, sh, width, height) {
      const scale = Math.min(width / sw, height / sh);
      const drawWidth = sw * scale;
      const drawHeight = sh * scale;
      const dx = (width - drawWidth) / 2;
      const dy = (height - drawHeight) / 2;
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, width, height);
      ctx.save();
      ctx.beginPath();
      ctx.rect(dx, dy, drawWidth, drawHeight);
      ctx.clip();
      ctx.filter = "grayscale(1) contrast(1.15)";
      ctx.drawImage(source, sx, sy, sw, sh, dx, dy, drawWidth, drawHeight);
      ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.24)";
      ctx.lineWidth = 1;
      ctx.strokeRect(dx + 0.5, dy + 0.5, Math.max(0, drawWidth - 1), Math.max(0, drawHeight - 1));
    }

    function drawPolygonPreview(ctx, points, width, height) {
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, width, height);
      const xs = points.map((point) => point[0]);
      const ys = points.map((point) => point[1]);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const boxWidth = Math.max(1, maxX - minX);
      const boxHeight = Math.max(1, maxY - minY);
      const scale = Math.min(width / boxWidth, height / boxHeight) * 0.88;
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const drawX = width / 2 - centerX * scale;
      const drawY = height / 2 - centerY * scale;

      const polygonPath = new Path2D();
      points.forEach(([pointX, pointY], index) => {
        const x = drawX + pointX * scale;
        const y = drawY + pointY * scale;
        if (index === 0) polygonPath.moveTo(x, y);
        else polygonPath.lineTo(x, y);
      });
      polygonPath.closePath();

      ctx.save();
      ctx.clip(polygonPath);
      ctx.filter = "grayscale(1) contrast(1.15)";
      ctx.drawImage(
        video,
        0,
        0,
        state.data.meta.width,
        state.data.meta.height,
        drawX,
        drawY,
        state.data.meta.width * scale,
        state.data.meta.height * scale
      );
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.72)";
      ctx.lineWidth = 1.2;
      ctx.stroke(polygonPath);
      ctx.restore();
    }

    function drawRoiPreviews() {
      if (!state.data) return;
      const index = state.frameIndex;
      document.querySelectorAll(".roi-item").forEach((item) => {
        const fishId = Number(item.dataset.fish);
        const fish = fishById(fishId);
        const canvas = item.querySelector(".roi-canvas");
        const { ctx, width, height } = resizeCanvas(canvas);
        const meanNode = item.querySelector(".roi-mean");
        const varianceNode = item.querySelector(".roi-variance");
        const stateNode = item.querySelector(".roi-state");
        const box = index < fish.boxes.length ? fish.boxes[index] : null;

        ctx.fillStyle = "#101820";
        ctx.fillRect(0, 0, width, height);
        if (!box || index > fish.lastFrame - 1) {
          stateNode.textContent = "无跟踪";
          stateNode.className = "roi-state invalid";
          meanNode.textContent = "—";
          varianceNode.textContent = "—";
          return;
        }

        const [x1, y1, x2, y2, valid] = box;
        if (state.videoReady) {
          drawContainedImage(ctx, video, x1, y1, x2 - x1, y2 - y1, width, height);
        }
        const mean = fish.mean[index];
        const variance = fish.variance[index];
        const validNow = valid && Number.isFinite(mean) && Number.isFinite(variance);
        stateNode.textContent = validNow ? "有效" : "跟踪无效";
        stateNode.className = `roi-state ${validNow ? "valid" : "invalid"}`;
        meanNode.textContent = formatNumber(mean, 2);
        varianceNode.textContent = formatNumber(variance, 1);
      });
    }

    function chartTimeRange() {
      const duration = state.data.meta.duration;
      if (state.windowSeconds === 0) return [0, duration];
      const half = state.windowSeconds / 2;
      let start = currentTime() - half;
      let end = currentTime() + half;
      if (start < 0) {
        end -= start;
        start = 0;
      }
      if (end > duration) {
        start -= end - duration;
        end = duration;
      }
      return [Math.max(0, start), Math.min(duration, end)];
    }

    function tickStepForWindow(seconds) {
      if (seconds <= 12) return 2;
      if (seconds <= 22) return 5;
      return 5;
    }

    function niceRange(values) {
      if (!values.length) return [0, 1];
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (!Number.isFinite(min) || !Number.isFinite(max)) return [0, 1];
      if (Math.abs(max - min) < 1e-6) {
        min -= 1;
        max += 1;
      }
      const padding = (max - min) * 0.1;
      return [min - padding, max + padding];
    }

    function getMetricConfig(kind) {
      if (kind === "mean") {
        return {
          rawKey: "mean",
          filteredKey: "filteredMean",
          smoothedKey: "smoothedMean",
          baselineKey: "baselineMean",
          color: COLORS[1].line,
          canvas: meanChart,
          title: meanChartTitle,
          unit: meanChartUnit,
          label: "灰度均值",
        };
      }
      return {
        rawKey: "variance",
        filteredKey: "filteredVariance",
        smoothedKey: "smoothedVariance",
        baselineKey: "baselineVariance",
        color: COLORS[1].line,
        canvas: varianceChart,
        title: varianceChartTitle,
        unit: varianceChartUnit,
        label: "灰度方差",
      };
    }

    function drawChart(kind) {
      if (!state.data) return;
      const config = getMetricConfig(kind);
      const { ctx, width, height } = resizeCanvas(config.canvas);
      ctx.clearRect(0, 0, width, height);
      const singleFish = state.selectedFish === "all"
        ? null
        : fishById(Number(state.selectedFish));
      const showPeakOverlay = Boolean(singleFish);
      const detectedPeaks = showPeakOverlay ? detectFishPeaks(singleFish, kind) : [];
      const peakIndices = detectedPeaks.map((peak) => peak.index);
      const activeDurationSeconds = singleFish
        ? (singleFish.lastFrame - singleFish.firstFrame + 1) / state.data.meta.fps
        : null;
      const peakRate = singleFish
        ? detectedPeaks.length * 60.0 / activeDurationSeconds
        : null;
      const margin = { left: 58, right: 16, top: showPeakOverlay ? 44 : 24, bottom: 28 };
      const plotWidth = Math.max(1, width - margin.left - margin.right);
      const plotHeight = Math.max(1, height - margin.top - margin.bottom);
      const [timeStart, timeEnd] = chartTimeRange();
      const timeSpan = Math.max(0.001, timeEnd - timeStart);
      const fishIds = selectedFishIds();
      const series = [];
      const allValues = [];
      const fps = state.data.meta.fps;

      for (const id of fishIds) {
        const fish = fishById(id);
        const source = state.mode === "filtered"
          ? fish[config.smoothedKey]
          : fish[config.rawKey];
        const baseline = fish[config.baselineKey];
        const startIndex = Math.max(0, Math.floor(timeStart * fps));
        const endIndex = Math.min(fish.lastFrame - 1, Math.ceil(timeEnd * fps));
        const points = [];
        for (let index = startIndex; index <= endIndex; index += 1) {
          if (!fish.valid[index]) continue;
          const value = source[index];
          if (!Number.isFinite(value)) continue;
          const shownValue = state.mode === "raw" && state.selectedFish === "all"
            ? value - baseline
            : value;
          points.push({ time: index / fps, value: shownValue });
          allValues.push(shownValue);
        }
        series.push({ fish, points });
      }

      const [yMin, yMax] = niceRange(allValues);
      const xToPx = (time) => margin.left + ((time - timeStart) / timeSpan) * plotWidth;
      const yToPx = (value) => margin.top + (1 - (value - yMin) / Math.max(1e-9, yMax - yMin)) * plotHeight;
      ctx.font = "11px Microsoft YaHei, sans-serif";
      ctx.textBaseline = "middle";

      ctx.strokeStyle = "#e2e6eb";
      ctx.fillStyle = "#667085";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i += 1) {
        const y = margin.top + (i / 5) * plotHeight;
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(width - margin.right, y);
        ctx.stroke();
        const value = yMax - ((yMax - yMin) * i) / 5;
        ctx.textAlign = "right";
        ctx.fillText(formatNumber(value, Math.abs(yMax - yMin) < 10 ? 2 : 1), margin.left - 8, y);
      }

      const tickStep = tickStepForWindow(timeSpan);
      const firstTick = Math.ceil(timeStart / tickStep) * tickStep;
      for (let tick = firstTick; tick <= timeEnd; tick += tickStep) {
        const x = xToPx(tick);
        ctx.beginPath();
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, height - margin.bottom);
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillText(`${tick.toFixed(0)}s`, x, height - 11);
      }

      series.forEach((item) => {
        ctx.strokeStyle = showPeakOverlay && state.mode === "filtered"
          ? "#c1121f"
          : COLORS[item.fish.id].line;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        let penDown = false;
        item.points.forEach((point) => {
          const x = xToPx(point.time);
          const y = yToPx(point.value);
          if (!penDown) {
            ctx.moveTo(x, y);
            penDown = true;
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();
      });

      const playheadX = xToPx(currentTime());
      if (playheadX >= margin.left && playheadX <= width - margin.right) {
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(playheadX, margin.top);
        ctx.lineTo(playheadX, height - margin.bottom);
        ctx.stroke();
      }

      if (showPeakOverlay && peakIndices.length) {
        const annotationY = margin.top - 11;
        const plottedSource = state.mode === "raw"
          ? singleFish[config.rawKey]
          : singleFish[config.smoothedKey];
        ctx.save();
        ctx.font = "600 10px Microsoft YaHei, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#c1121f";
        for (let order = 0; order < peakIndices.length; order += 1) {
          const peakIndex = peakIndices[order];
          const peakTime = peakIndex / fps;
          if (peakTime < timeStart || peakTime > timeEnd) continue;
          const peakValue = plottedSource[peakIndex];
          if (!Number.isFinite(peakValue)) continue;
          const peakX = xToPx(peakTime);
          const peakY = yToPx(peakValue);
          ctx.strokeStyle = "rgba(193, 18, 31, 0.35)";
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(peakX, annotationY + 5);
          ctx.lineTo(peakX, peakY);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.arc(peakX, peakY, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillText(String(order + 1), peakX, annotationY - 10);
        }
        ctx.restore();
      }

      const legendX = width - margin.right - 6;
      let legendY = margin.top + 4;
      ctx.textAlign = "right";
      for (const item of series) {
        ctx.fillStyle = showPeakOverlay && state.mode === "filtered"
          ? "#c1121f"
          : COLORS[item.fish.id].line;
        ctx.fillRect(legendX - 35, legendY - 1, 20, 2);
        const peakCount = detectFishPeaks(item.fish, kind).length;
        ctx.fillText(`鱼 ${item.fish.id} · ${peakCount}峰`, legendX, legendY);
        legendY += 15;
      }

      if (state.mode === "variance") {
        config.title.textContent = state.selectedFish === "all"
          ? "灰度方差变化量"
          : "灰度方差";
        config.unit.textContent = showPeakOverlay
          ? `${peakIndices.length} 个峰 · ${peakRate.toFixed(1)} 次/分`
          : "相对各自中位数";
      } else if (state.mode === "raw") {
        config.title.textContent = state.selectedFish === "all"
          ? `${config.label}变化量`
          : config.label;
        config.unit.textContent = showPeakOverlay
          ? `${peakIndices.length} 个峰 · ${peakRate.toFixed(1)} 次/分`
          : state.selectedFish === "all"
          ? "相对各自中位数"
          : "原始灰度值";
      } else {
        config.title.textContent = `${config.label}带通残差`;
        config.unit.textContent = showPeakOverlay
          ? `${peakIndices.length} 个峰 · ${peakRate.toFixed(1)} 次/分`
          : "标准化幅值 z";
      }
      config.unit.style.color = showPeakOverlay ? "#c1121f" : "";
      config.unit.style.fontWeight = showPeakOverlay ? "700" : "";
    }

    function drawCharts() {
      if (state.mode === "variance") drawChart("variance");
      else drawChart("mean");
    }

    function updateReadouts() {
      const index = state.frameIndex;
      timeReadout.textContent = formatTime(currentTime());
      frameReadout.textContent = `${index + 1} / ${state.data.meta.frameCount}`;
      frameSlider.value = String(index + 1);
      const activeFish = state.data.fish.filter(
        (fish) => index >= fish.firstFrame - 1 && index < fish.lastFrame
      );
      syncBadge.textContent = activeFish.length
        ? `${activeFish.length} 条鱼跟踪有效`
        : "跟踪结束";
    }

    function updateView() {
      if (!state.metadataReady || !state.data) return;
      state.frameIndex = frameIndexFromTime(currentTime());
      updateReadouts();
      drawVideoOverlay();
      drawRoiPreviews();
      drawCharts();
    }

    function startPlaybackLoop() {
      let lastDraw = 0;
      const loop = (timestamp) => {
        if (video.ended) return;
        if (!video.paused) {
          updateView();
          if (timestamp - lastDraw > 33) lastDraw = timestamp;
          requestAnimationFrame(loop);
        }
      };
      requestAnimationFrame(loop);
    }

    function seekFromPointer(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      const marginLeft = 58;
      const marginRight = 16;
      const plotWidth = Math.max(1, rect.width - marginLeft - marginRight);
      const x = Math.max(marginLeft, Math.min(rect.width - marginRight, event.clientX - rect.left));
      const [start, end] = chartTimeRange();
      const time = start + ((x - marginLeft) / plotWidth) * (end - start);
      video.currentTime = Math.max(0, Math.min(state.data.meta.duration, time));
      updateView();
    }

    [meanChart, varianceChart].forEach((canvas) => {
      canvas.title = "点击或拖动以定位视频";
      canvas.addEventListener("pointerdown", (event) => {
        state.draggingChart = canvas;
        canvas.setPointerCapture(event.pointerId);
        video.pause();
        seekFromPointer(event, canvas);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (state.draggingChart === canvas) seekFromPointer(event, canvas);
      });
      canvas.addEventListener("pointerup", () => {
        state.draggingChart = null;
      });
      canvas.addEventListener("pointercancel", () => {
        state.draggingChart = null;
      });
    });

    document.getElementById("prevFrame").addEventListener("click", () => {
      video.pause();
      seekToFrame(frameIndexFromTime(currentTime()) - 1);
    });
    document.getElementById("nextFrame").addEventListener("click", () => {
      video.pause();
      seekToFrame(frameIndexFromTime(currentTime()) + 1);
    });
    frameSlider.addEventListener("input", () => {
      video.pause();
      seekToFrame(Number(frameSlider.value) - 1);
    });

    document.getElementById("modeControl").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-mode]");
      if (!button) return;
      state.mode = button.dataset.mode;
      document.querySelectorAll("#modeControl button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
      signalSection.classList.toggle("variance-focus", state.mode === "variance");
      chartModeNote.textContent = state.mode === "raw"
        ? "区域原始灰度"
        : state.mode === "variance"
          ? "逐帧区域灰度方差"
          : "0.60–1.50 Hz 带通残差";
      drawCharts();
    });
    document.getElementById("windowControl").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-window]");
      if (!button) return;
      state.windowSeconds = Number(button.dataset.window);
      document.querySelectorAll("#windowControl button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
      drawCharts();
    });
    document.getElementById("peakProminence").addEventListener("input", (event) => {
      state.peakProminence = Number(event.target.value);
      document.getElementById("peakProminenceValue").textContent =
        state.peakProminence.toFixed(2);
      drawCharts();
    });
    document.getElementById("peakDistance").addEventListener("input", (event) => {
      state.peakDistance = Number(event.target.value);
      document.getElementById("peakDistanceValue").textContent =
        `${state.peakDistance.toFixed(2)}s`;
      drawCharts();
    });
    layoutSize.addEventListener("input", () => {
      applyLayoutSize();
      try {
        localStorage.setItem("squareLayoutSize", layoutSize.value);
      } catch {}
    });
    speedControl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-speed]");
      if (!button) return;
      applyPlaybackRate(button.dataset.speed);
    });
    document.getElementById("fishControl").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-fish]");
      if (!button) return;
      state.selectedFish = button.dataset.fish;
      document.querySelectorAll("#fishControl button").forEach((item) => {
        item.classList.toggle("active", item === button);
      });
      drawCharts();
    });

    video.addEventListener("loadedmetadata", () => {
      state.metadataReady = true;
      frameSlider.max = String(state.data?.meta.frameCount || Math.round(video.duration * 50));
      applyPlaybackRate(preferredPlaybackRate, false);
      updateView();
    });
    video.addEventListener("loadeddata", () => {
      state.videoReady = true;
      updateView();
    });
    video.addEventListener("seeked", updateView);
    video.addEventListener("play", startPlaybackLoop);
    video.addEventListener("timeupdate", updateView);
    video.addEventListener("ended", updateView);

    window.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement) return;
      if (event.code === "Space") {
        event.preventDefault();
        video.paused ? video.play() : video.pause();
      } else if (event.code === "ArrowLeft") {
        event.preventDefault();
        video.pause();
        seekToFrame(frameIndexFromTime(currentTime()) - 1);
      } else if (event.code === "ArrowRight") {
        event.preventDefault();
        video.pause();
        seekToFrame(frameIndexFromTime(currentTime()) + 1);
      }
    });

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        applyLayoutSize();
        updateView();
      }, 80);
    });

    try {
      const storedLayoutSize = localStorage.getItem("squareLayoutSize");
      if (storedLayoutSize && Number(storedLayoutSize) >= 35 && Number(storedLayoutSize) <= 60) {
        layoutSize.value = storedLayoutSize;
      }
    } catch {}
    try {
      const storedPlaybackRate = Number(localStorage.getItem("squarePlaybackRate"));
      if ([0.25, 0.5, 1, 2, 4].includes(storedPlaybackRate)) {
        preferredPlaybackRate = storedPlaybackRate;
      }
    } catch {}
    applyPlaybackRate(preferredPlaybackRate, false);
    layoutSizeValue.textContent = `${layoutSize.value}%`;
    applyLayoutSize();

    fetch("/data.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((data) => {
        state.data = data;
        // 仅为当前分析中的鱼创建展示区域；不假设鱼号连续或数量固定。
        const palette=Object.values(COLORS);
        data.fish.forEach((fish,index)=>{COLORS[fish.id]??=palette[index%palette.length];});
        state.selectedFish=String(data.fish[0].id);
        document.querySelector(".roi-list").innerHTML=data.fish.map(fish=>`
          <article class="roi-item" data-fish="${Number(fish.id)}" style="--fish-color:${COLORS[fish.id].line}">
            <header class="roi-head"><span class="fish-dot"></span><h3>区域 ${Number(fish.id)}</h3><span class="roi-state">—</span></header>
            <canvas class="roi-canvas" width="600" height="262"></canvas>
            <div class="roi-values"><div><span>灰度均值</span><strong class="roi-mean">—</strong></div>
              <div><span>灰度方差</span><strong class="roi-variance">—</strong></div></div>
          </article>`).join("");
        document.getElementById("fishControl").innerHTML=
          '<button type="button" class="fish-button" data-fish="all">全部</button>'+
          data.fish.map((fish,index)=>`<button type="button" class="fish-button ${index===0?'active':''}" data-fish="${Number(fish.id)}">区域 ${Number(fish.id)}</button>`).join("");
        state.peakProminence=Number(data.meta.peakProminence??state.peakProminence);
        state.peakDistance=Number(data.meta.peakDistanceS??state.peakDistance);
        document.getElementById("peakProminence").value=state.peakProminence;
        document.getElementById("peakProminenceValue").textContent=state.peakProminence.toFixed(2);
        document.getElementById("peakDistance").value=state.peakDistance;
        document.getElementById("peakDistanceValue").textContent=`${state.peakDistance.toFixed(2)}s`;
        frameSlider.min = "1";
        frameSlider.max = String(data.meta.frameCount);
        bandNote.textContent = `带通频带 ${data.meta.bandLowHz.toFixed(2)}–${data.meta.bandHighHz.toFixed(2)} Hz`;
        dataNote.textContent = `${data.meta.fps.toFixed(0)} fps · ${data.meta.frameCount} 帧 · ${data.meta.duration.toFixed(2)} 秒`;
        if (video.readyState >= 1) {
          state.metadataReady = true;
          if (video.readyState >= 2) state.videoReady = true;
          updateView();
        }
        loading.classList.add("hidden");
      })
      .catch((error) => {
        loadingText.textContent = `数据载入失败：${error.message}`;
      });
  </script>
</body>
</html>
