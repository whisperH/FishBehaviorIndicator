<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鱼体角度视频</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: light-dark(#f4f7f6, #0f1415);
      --foreground: light-dark(#172220, #e7efec);
      --muted: light-dark(#e7eeeb, #1b2728);
      --muted-foreground: light-dark(#60706c, #9eb0ab);
      --border: light-dark(#d2ded9, #304041);
      --series-1: light-dark(#0d8778, #4bd3bf);
      --series-2: light-dark(#c76628, #ffab6b);
      --series-3: light-dark(#316bc0, #79a7ff);
      --series-4: light-dark(#ad3852, #ff8196);
      --series-5: light-dark(#7456ae, #baa2ff);
      --series-6: light-dark(#77831b, #c5d453);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    button, select { font: inherit; }

    .page {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 40px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 3px; font-size: 28px; font-weight: 500; letter-spacing: 0; }
    h2 { margin-bottom: 10px; font-size: 18px; font-weight: 500; }
    .subtle { color: var(--muted-foreground); }

    .meta {
      color: var(--muted-foreground);
      text-align: right;
      white-space: nowrap;
    }

    .video-section {
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #050808;
      border-radius: 8px;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      object-fit: contain;
      background: #050808;
    }

    canvas {
      pointer-events: none;
    }

    .video-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
    }

    .btn {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    }

    .btn:hover { background: var(--muted); }
    .btn:focus-visible, .legend-button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
    .btn.primary { border-color: var(--foreground); }

    .video-time {
      min-width: 185px;
      font-variant-numeric: tabular-nums;
    }

    .overlay-status {
      color: var(--muted-foreground);
      margin-left: auto;
    }

    .live-summary {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      padding: 14px 0 4px;
    }

    .live-summary div {
      min-width: 100px;
    }

    .live-summary span {
      display: block;
      color: var(--muted-foreground);
      font-size: 11px;
    }

    .live-summary strong {
      display: block;
      font-size: 19px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .chart-section {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 8px;
    }

    .legend-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 2px;
      border: 0;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    }

    .legend-button[aria-pressed="false"] { opacity: .34; }

    .swatch {
      width: 18px;
      height: 3px;
      border-radius: 2px;
      background: currentColor;
    }

    .chart-wrap {
      position: relative;
      min-height: 340px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      overflow: visible;
    }

    .chart-tooltip {
      position: absolute;
      pointer-events: none;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .16);
      font-size: 12px;
      opacity: 0;
      z-index: 3;
    }

    .chart-tooltip.visible { opacity: 1; }

    .table-section {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }

    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted-foreground); font-weight: 500; }
    tbody tr:hover { background: var(--muted); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1400px); padding-top: 14px; }
      .page-header { align-items: flex-start; flex-direction: column; }
      .meta { text-align: left; white-space: normal; }
      .overlay-status { margin-left: 0; width: 100%; }
      .video-frame { border-radius: 6px; }
      .table-scroll { overflow-x: auto; }
      table { min-width: 680px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>鱼体角度视频</h1>
        <p class="subtle">播放视频时，SAM3 鱼体掩膜、角度线和数值会跟随鱼体移动</p>
      </div>
      <div class="meta">angle.mp4 · RTX 3060 · SAM3 框提示分割</div>
    </header>

    <section class="video-section" aria-label="鱼体角度视频播放器">
      <div class="video-frame">
        <video id="angle-video" controls muted playsinline preload="metadata" poster="/results/angle/video_poster.jpg">
          <source src="/video" type="video/mp4">
        </video>
        <canvas id="angle-overlay" aria-label="鱼体角度叠加层"></canvas>
      </div>
      <div class="video-controls">
        <button class="btn primary" id="play-toggle" type="button">播放</button>
        <div class="video-time">
          <span id="frame-status">第 1 帧</span>
          <span class="subtle" id="time-status">0.00 s</span>
        </div>
        <select class="btn" id="speed-select" aria-label="播放速度">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <span class="overlay-status" id="overlay-status">等待视频加载</span>
      </div>
      <div class="live-summary" aria-live="polite">
        <div><span>当前可见</span><strong id="live-count">—</strong></div>
        <div><span>平均锐角</span><strong id="live-mean">—</strong></div>
        <div><span>最小锐角</span><strong id="live-min">—</strong></div>
        <div><span>最大锐角</span><strong id="live-max">—</strong></div>
      </div>
    </section>

    <section class="chart-section" aria-labelledby="chart-title">
      <h2 id="chart-title">角度时间序列</h2>
      <div class="legend" id="legend" aria-label="轨迹显示开关"></div>
      <div class="chart-wrap">
        <svg class="chart-svg" id="angle-chart" role="img" aria-labelledby="chart-title chart-desc"></svg>
        <div class="chart-tooltip" id="chart-tooltip" role="tooltip"></div>
        <p class="sr-only" id="chart-desc">六条鱼的角度随时间变化，点击数据点可以跳转到对应视频位置。</p>
      </div>
    </section>

    <section class="table-section" aria-labelledby="table-title">
      <h2 id="table-title">轨迹角度汇总</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>轨迹</th>
              <th>有效采样</th>
              <th>平均角</th>
              <th>中位角</th>
              <th>标准差</th>
              <th>最小角</th>
              <th>最大角</th>
            </tr>
          </thead>
          <tbody id="summary-body"></tbody>
        </table>
      </div>
    </section>

  </div>

      function decodeBase64Utf8(id) {
        const binary = atob(document.getElementById(id).textContent.trim());

      function parseCsv(text) {
        const clean = text.replace(/^\uFEFF/, "").trim();
        const lines = clean.split(/\r?\n/);
        const headers = lines.shift().split(",");
        return lines.filter(Boolean).map(line => {
          const values = line.split(",");
          const row = {};
          headers.forEach((header, index) => {
            const raw = values[index] ?? "";
            row[header] = ["frame", "track_id", "mask_area"].includes(header)
              ? Number(raw)
              : ["score", "box_iou", "time_s", "center_x", "center_y",
                 "angle_horizontal_deg", "orientation_deg", "elongation"].includes(header)
                ? Number(raw)
                : raw === "True" ? true : raw === "False" ? false : raw;
          });
          return row;
        });
      }

      function parseMotCsv(text) {
        const clean = text.replace(/^\uFEFF/, "").trim();
        return clean.split(/\r?\n/).filter(Boolean).map(line => {
          const values = line.split(",");
          return {
            frame: Number(values[0]),
            track_id: Number(values[1]),
            x: Number(values[2]) * MOT_SCALE_X,
            y: Number(values[3]) * MOT_SCALE_Y,
            w: Number(values[4]) * MOT_SCALE_X,
            h: Number(values[5]) * MOT_SCALE_Y,
            confidence: Number(values[8] ?? 1)

        }).filter(row =>

          Number.isFinite(row.track_id) &&
          Number.isFinite(row.x) &&

      const angleRows = parseCsv(decodeBase64Utf8("angle-data")).filter(row => row.valid === true);
      const motRows = parseMotCsv(decodeBase64Utf8("mot-data"));
      const maskData = JSON.parse(decodeBase64Utf8("mask-data"));
      const maskSamples = maskData.samples || [];
      const maskByTrack = new Map(
        [...new Set(maskSamples.map(sample => sample.track_id))].map(track => [
          track,
          maskSamples.filter(sample => sample.track_id === track).sort((a, b) => a.frame - b.frame)

      const tracks = [...new Set(angleRows.map(row => row.track_id))].sort((a, b) => a - b);
      const angleByTrack = new Map(tracks.map(track =>

      const trackColor = track => colors[tracks.indexOf(track) % colors.length];

      function interpolateTrack(track, frame) {
        const samples = angleByTrack.get(track);
        if (!samples?.length) return null;
        if (frame <= samples[0].frame) return samples[0];

        let high = samples.length - 1;

          frame,
          orientation_deg: orientation,
          angle_horizontal_deg: Math.min(orientation, 180 - orientation),
          box_iou: first.box_iou + (second.box_iou - first.box_iou) * t,
          elongation: first.elongation + (second.elongation - first.elongation) * t

      function resamplePolygon(points, count = 56) {
        if (!points?.length) return [];
        const closed = [...points, points[0]];
        const lengths = [0];
        for (let index = 1; index < closed.length; index += 1) {

          const dy = closed[index][1] - closed[index - 1][1];

            first[1] + (second[1] - first[1]) * t

        const scaleX = targetBox.w / Math.max(1, sourceBox[2]);
        const scaleY = targetBox.h / Math.max(1, sourceBox[3]);

          return [
            point[0] + (other[0] - point[0]) * t,
            point[1] + (other[1] - point[1]) * t

      }

            context.fillStyle = color;
            context.fill();
            context.globalAlpha = 0.9;
            context.lineWidth = Math.max(2, width / 900);
            context.strokeStyle = color;
            context.stroke();
          }

          context.strokeStyle = color;
          context.lineWidth = Math.max(2, width / 720);
          context.globalAlpha = 0.88;
          context.strokeRect(box.x, box.y, box.w, box.h);

          context.lineWidth = Math.max(3, width / 480);
          context.beginPath();
          context.moveTo(cx - dx, cy - dy);
          context.lineTo(cx + dx, cy + dy);
          context.stroke();

          context.fillStyle = color;
          context.beginPath();
          context.arc(cx, cy, Math.max(4, width / 360), 0, Math.PI * 2);
          context.fill();

          const label = `ID ${box.track_id}  ${fmt(angle.angle_horizontal_deg)}°`;
          const metrics = context.measureText(label);
          const paddingX = 7;
          const paddingY = 5;
          const labelWidth = metrics.width + paddingX * 2;
          const labelHeight = fontSize + paddingY * 2;
          const labelX = Math.min(width - labelWidth - 6, Math.max(6, box.x));
          const labelY = Math.max(6, box.y - labelHeight - 5);

          context.globalAlpha = 0.84;
          context.fillStyle = "#07100e";
          context.fillRect(labelX, labelY, labelWidth, labelHeight);
          context.globalAlpha = 1;
          context.fillStyle = "#ffffff";
          context.fillText(label, labelX + paddingX, labelY + labelHeight / 2);
        });

        context.globalAlpha = 1;
        if (frame !== lastUiTime && shownAngles.length) {
          lastUiTime = frame;
          const values = shownAngles.map(row => row.angle_horizontal_deg);
          frameStatus.textContent = `第 ${frame} 帧`;
          timeStatus.textContent = `${fmt(video.currentTime || 0, 2)} s`;
          document.getElementById("live-count").textContent = `${values.length} 条`;
          document.getElementById("live-mean").textContent =
            `${fmt(values.reduce((a, b) => a + b, 0) / values.length)}°`;
          document.getElementById("live-min").textContent = `${fmt(Math.min(...values))}°`;
          document.getElementById("live-max").textContent = `${fmt(Math.max(...values))}°`;
          overlayStatus.textContent = `SAM3 掩膜 + 角度 · ${values.length} 条鱼`;
          drawChart();
        }
        requestAnimationFrame(drawOverlay);
      }

      function buildLegend() {
        const legend = document.getElementById("legend");
        tracks.forEach(track => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "legend-button";
          button.setAttribute("aria-pressed", "true");
          button.style.color = trackColor(track);
          button.innerHTML = `<span class="swatch"></span><span style="color:var(--foreground)">轨迹 ${track}</span>`;
          button.addEventListener("click", () => {
            if (visibleTracks.has(track)) visibleTracks.delete(track);
            else visibleTracks.add(track);
            button.setAttribute("aria-pressed", String(visibleTracks.has(track)));
            drawChart();
          });
          legend.appendChild(button);
        });
      }

      function drawChart() {
        const width = chartWrap.clientWidth;
        const height = Math.max(300, Math.min(430, width * 0.46));
        const margin = { top: 16, right: 18, bottom: 44, left: 58 };
        chart.setAttribute("viewBox", `0 0 ${width} ${height}`);
        chart.innerHTML = "";
        const innerWidth = width - margin.left - margin.right;
        const innerHeight = height - margin.top - margin.bottom;
        const times = angleRows.map(row => row.time_s);
        const xMin = Math.min(...times);
        const xMax = Math.max(...times);
        const x = value => margin.left + (value - xMin) / Math.max(1e-9, xMax - xMin) * innerWidth;
        const y = value => margin.top + (90 - value) / 90 * innerHeight;
        const ns = "http://www.w3.org/2000/svg";
        const group = document.createElementNS(ns, "g");
        chart.appendChild(group);

        for (let value = 0; value <= 90; value += 15) {
          const line = document.createElementNS(ns, "line");
          line.setAttribute("x1", margin.left);
          line.setAttribute("x2", width - margin.right);
          line.setAttribute("y1", y(value));
          line.setAttribute("y2", y(value));
          line.setAttribute("stroke", "var(--border)");
          group.appendChild(line);
          const label = document.createElementNS(ns, "text");
          label.setAttribute("x", margin.left - 10);
          label.setAttribute("y", y(value) + 4);
          label.setAttribute("text-anchor", "end");
          label.setAttribute("fill", "var(--muted-foreground)");
          label.setAttribute("font-size", "12");
          label.textContent = `${value}°`;
          group.appendChild(label);
        }

        const tickCount = width < 560 ? 4 : 6;
        for (let index = 0; index < tickCount; index += 1) {
          const value = xMin + (xMax - xMin) * index / (tickCount - 1);
          const label = document.createElementNS(ns, "text");
          label.setAttribute("x", x(value));
          label.setAttribute("y", height - 15);
          label.setAttribute("text-anchor", index === 0 ? "start" : index === tickCount - 1 ? "end" : "middle");
          label.setAttribute("fill", "var(--muted-foreground)");
          label.setAttribute("font-size", "12");
          label.textContent = `${fmt(value, 1)} s`;
          group.appendChild(label);
        }

        const xTitle = document.createElementNS(ns, "text");
        xTitle.setAttribute("x", margin.left + innerWidth / 2);
        xTitle.setAttribute("y", height - 1);
        xTitle.setAttribute("text-anchor", "middle");
        xTitle.setAttribute("fill", "var(--foreground)");
        xTitle.setAttribute("font-size", "12");
        xTitle.textContent = "时间";
        group.appendChild(xTitle);

        const currentX = x(video.currentTime || 0);
        const selected = document.createElementNS(ns, "line");
        selected.setAttribute("x1", currentX);
        selected.setAttribute("x2", currentX);
        selected.setAttribute("y1", margin.top);
        selected.setAttribute("y2", margin.top + innerHeight);
        selected.setAttribute("stroke", "var(--foreground)");
        selected.setAttribute("stroke-opacity", ".38");
        group.appendChild(selected);

        tracks.filter(track => visibleTracks.has(track)).forEach(track => {
          const points = angleByTrack.get(track);
          const path = document.createElementNS(ns, "path");
          path.setAttribute("d", points.map((row, index) =>
            `${index === 0 ? "M" : "L"} ${x(row.time_s)} ${y(row.angle_horizontal_deg)}`
          ).join(" "));
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", trackColor(track));
          path.setAttribute("stroke-width", "2");
          path.setAttribute("stroke-linejoin", "round");
          group.appendChild(path);

          points.forEach(row => {
            const circle = document.createElementNS(ns, "circle");
            circle.setAttribute("cx", x(row.time_s));
            circle.setAttribute("cy", y(row.angle_horizontal_deg));
            circle.setAttribute("r", "4");
            circle.setAttribute("fill", trackColor(track));
            circle.setAttribute("stroke", "var(--background)");
            circle.setAttribute("stroke-width", "1.5");
            circle.style.cursor = "pointer";
            circle.addEventListener("pointerenter", event => {
              tooltip.innerHTML = `<strong>轨迹 ${track}</strong><br>${fmt(row.angle_horizontal_deg)}° · ${fmt(row.time_s, 2)} s`;
              tooltip.classList.add("visible");
              const rect = chartWrap.getBoundingClientRect();
              tooltip.style.left = `${event.clientX - rect.left + 8}px`;
              tooltip.style.top = `${event.clientY - rect.top}px`;
            });
            circle.addEventListener("pointermove", event => {
              const rect = chartWrap.getBoundingClientRect();
              tooltip.style.left = `${event.clientX - rect.left + 8}px`;
              tooltip.style.top = `${event.clientY - rect.top}px`;
            });
            circle.addEventListener("pointerleave", () => tooltip.classList.remove("visible"));
            circle.addEventListener("click", () => {
              video.currentTime = row.time_s;
              video.pause();
            });
            group.appendChild(circle);
          });
        });
      }

      function buildSummaryTable() {
        const body = document.getElementById("summary-body");
        tracks.forEach(track => {
          const values = angleByTrack.get(track).map(row => row.angle_horizontal_deg);
          const mean = values.reduce((a, b) => a + b, 0) / values.length;
          const sorted = [...values].sort((a, b) => a - b);
          const median = sorted.length % 2
            ? sorted[Math.floor(sorted.length / 2)]
            : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
          const variance = values.reduce((sum, value) => sum + (value - mean) ** 2, 0) / values.length;
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td>轨迹 ${track}</td><td>${values.length}</td><td>${fmt(mean)}°</td>` +
            `<td>${fmt(median)}°</td><td>${fmt(Math.sqrt(variance))}°</td>` +
            `<td>${fmt(Math.min(...values))}°</td><td>${fmt(Math.max(...values))}°</td>`;
          body.appendChild(tr);
        });
      }

      playToggle.addEventListener("click", async () => {
        if (video.paused) await video.play();
        else video.pause();
      });

      video.addEventListener("play", () => { playToggle.textContent = "暂停"; });
      video.addEventListener("pause", () => { playToggle.textContent = "播放"; });
      video.addEventListener("loadedmetadata", () => {
        overlayStatus.textContent = "SAM3 掩膜与角度叠加已启用";
        drawChart();
      });
      video.addEventListener("seeked", () => {
        lastUiTime = -1;
        drawChart();
      });
      speedSelect.addEventListener("change", () => {
        video.playbackRate = Number(speedSelect.value);
      });

      const resizeObserver = new ResizeObserver(() => drawChart());
      resizeObserver.observe(chartWrap);

      buildLegend();
      buildSummaryTable();
      drawChart();
      requestAnimationFrame(drawOverlay);
    })();
  </script>
</body>
</html>
